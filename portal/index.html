<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin">
<meta name="color-scheme" content="light dark">
<meta name="omnibioai-studio-dev-origin" content="">
<title>OmniBioAI · Video Tutorials</title>
<script>
(() => {
  const root = document.documentElement;
  const params = new URLSearchParams(window.location.search);
  const themes = ['light', 'dark'];
  const accents = ['teal', 'blue', 'purple', 'orange'];
  const densities = ['comfortable', 'compact'];
  const motions = ['system', 'reduce'];
  const systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const choose = (name, choices, fallback) => choices.includes(params.get(`obai_${name}`)) ? params.get(`obai_${name}`) : fallback;

  root.dataset.theme = choose('theme', themes, systemTheme);
  root.dataset.accent = choose('accent', accents, 'teal');
  root.dataset.density = choose('density', densities, 'comfortable');
  root.dataset.motion = choose('motion', motions, 'system');
  root.dataset.embedded = window.parent !== window ? 'true' : 'false';

  const privateKeys = new Set([
    'token', 'access_token', 'refresh_token', 'id_token', 'password', 'api_key', 'api-key',
    'session', 'session_id', 'secret', 'client_secret', 'credential', 'authorization', 'auth',
    'user_id', 'email', 'organization', 'organization_id', 'account', 'account_id',
  ]);
  let changed = false;
  for (const key of Array.from(params.keys())) {
    if (key.toLowerCase().startsWith('obai_') || privateKeys.has(key.toLowerCase())) {
      params.delete(key);
      changed = true;
    }
  }
  if (changed) {
    const query = params.toString();
    window.history.replaceState(window.history.state, '', window.location.pathname + (query ? `?${query}` : '') + window.location.hash);
  }
})();
</script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="omnibioai-design-tokens.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<header class="topbar">
  <a class="back-to-studio" href="/studio" data-studio-link>← Back to Studio</a>
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--color-accent)"/>
          <stop offset="1" stop-color="var(--color-info)"/>
        </linearGradient>
      </defs>
      <rect width="32" height="32" rx="8" fill="url(#brandGradient)"/>
      <path d="M13 10.5v11l9-5.5z" fill="var(--color-on-accent)"/>
    </svg>
    <span class="brand-name">OmniBioAI <span class="brand-product">Videos</span></span>
  </div>
  <div class="topbar-path" aria-label="Location">
    <span>omnibioai</span>
    <span class="sep">/</span>
    <span class="current">videos</span>
  </div>
  <div class="topbar-badges">
    <span class="pill pill-green" id="statusPill" role="status">● LOADING</span>
    <span class="pill pill-orange">BETA</span>
  </div>
</header>

<main class="page" id="main">
  <div class="controls" id="controls">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true"></span>
      <input type="text" id="searchInput" placeholder="Search OmniBioAI videos..." autocomplete="off"
        aria-label="Search OmniBioAI videos" role="combobox" aria-autocomplete="list"
        aria-controls="suggestions" aria-expanded="false">
      <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search" hidden>✕</button>
      <div id="suggestions" class="suggestions" role="listbox" aria-label="Search suggestions" hidden></div>
    </div>
    <div id="categoryFilters" class="category-filters" role="group" aria-label="Video categories"></div>
  </div>

  <div id="library">
    <div class="page-heading">
      <div class="heading-row"><h1>Video Tutorials</h1><span class="video-count" id="videoCount"></span></div>
      <p>Platform walkthroughs, tutorials and workflow demonstrations</p>
    </div>
    <p id="resultStatus" class="result-status" role="status" aria-live="polite" aria-atomic="true"></p>

    <div id="content">
      <div class="state-box">
        <div class="spinner"></div>
        <p>Loading videos...</p>
      </div>
    </div>
  </div>

  <section id="watch" class="watch" aria-labelledby="watchTitle" hidden>
    <div class="watch-main">
      <button id="watchBack" class="watch-back" type="button">← All videos</button>
      <div class="player-frame">
        <video id="player" class="player" controls playsinline preload="metadata"></video>
        <p id="playerError" class="player-error" role="alert" hidden>This video could not be loaded. Please try again later.</p>
      </div>
      <h2 id="watchTitle" class="watch-title" tabindex="-1">—</h2>
      <div class="watch-channel">
        <span class="channel-avatar" aria-hidden="true">OB</span>
        <div>
          <div class="channel-name">OmniBioAI</div>
          <div class="watch-meta" id="watchMeta">—</div>
        </div>
      </div>
      <div class="watch-description">
        <p id="watchDesc"></p>
        <ul id="watchTerms" class="watch-terms" aria-label="Topics"></ul>
      </div>
    </div>
    <aside class="watch-aside" aria-labelledby="upNextHeading">
      <h2 id="upNextHeading" class="up-next-heading">Up next</h2>
      <div id="upNext" class="up-next"></div>
    </aside>
  </section>
</main>

<script src="embed-appearance.js"></script>
<script src="portal.js"></script>
</body>
</html>
