<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>OmniBioAI · Video Tutorials</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/portal.css">
</head>
<body>

<div class="topbar">
  <a class="back-to-studio" href="/studio" data-studio-link>← Back to Studio</a>
  <div class="topbar-path">
    <span>omnibioai</span>
    <span class="sep">/</span>
    <span class="current">videos</span>
  </div>
  <div class="topbar-badges">
    <span class="pill pill-green" id="statusPill">● LOADING</span>
    <span class="pill pill-orange">BETA</span>
  </div>
</div>

<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <video class="modal-video" id="modalVideo" controls></video>
    <div class="modal-footer">
      <div>
        <div class="modal-title" id="modalTitle">—</div>
        <div class="modal-meta" id="modalMeta">—</div>
      </div>
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">✕</button>
    </div>
  </div>
</div>

<main class="page">
  <div class="page-heading">
    <div class="heading-row"><h1>Video Tutorials</h1><span class="video-count" id="videoCount"></span></div>
    <p>Platform walkthroughs, tutorials and workflow demonstrations</p>
  </div>

  <div class="controls" id="controls">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="text" id="searchInput" placeholder="Search OmniBioAI videos..." autocomplete="off"
        aria-label="Search OmniBioAI videos" role="combobox" aria-autocomplete="list"
        aria-controls="suggestions" aria-expanded="false">
      <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search" hidden>✕</button>
      <div id="suggestions" class="suggestions" role="listbox" aria-label="Search suggestions" hidden></div>
    </div>
    <div id="categoryFilters" class="category-filters" role="group" aria-label="Video categories"></div>
  </div>
  <p id="resultStatus" class="result-status" role="status" aria-live="polite" aria-atomic="true"></p>

  <div id="content">
    <div class="state-box">
      <div class="spinner"></div>
      <p>Loading videos...</p>
    </div>
  </div>
</main>

<script src="/portal.js"></script>
</body>
</html>
