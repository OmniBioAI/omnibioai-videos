server {
    listen 8086;

    # The image copies content/ to /usr/share/nginx/html/. Keep the /videos/
    # URL namespace used by the page while mapping it to that packaged root.
    location /videos/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;
    }

    location = /videos.json {
        alias /usr/share/nginx/html/videos.json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Direct asset URLs are also supported by the manifest fallback and API
    # consumers. Apply the same media cache policy to those root-level files.
    location ~* \\.(?:mp4|webm|mov)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
