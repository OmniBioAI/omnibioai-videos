# Public, read-only video portal (videos.omnibioai.org).
#
# This release config is bind-mounted by the production Compose pin. It serves
# only the reviewed React bundle, generated public catalog, and exact-match
# approved media locations; there is no SPA fallback or directory listing.
server {
    listen 8086;
    server_name _;
    server_tokens off;
    autoindex off;
    root /usr/share/nginx/html;

    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-fGOdEEm7bxtwQDUOzLRlOX88ho4NZiMj2OMgp8zBzNQ='; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://webstudio.omnibioai.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = / {
        try_files /index.html =404;
        expires epoch;
    }

    location = /index.html { expires epoch; }
    location = /portal.css { expires epoch; }
    location = /embed-appearance.js { expires epoch; }
    location = /portal.js  { expires epoch; }
    location = /shared.js  { expires epoch; }

    location = /videos.json {
        alias /run/publication/videos.json;
        default_type application/json;
        expires epoch;
    }

    include /run/publication/media.conf;

    location ^~ /videos/ {
        return 404;
    }

    location / {
        default_type text/plain;
        return 404 "Not Found\n";
    }
}
