# Studio "Video Tutorials" service (videos:8086).
#
# Studio embeds this page at its same-origin /_svc/videos/ route; the router strips that
# prefix and forwards here without authentication, so this service publishes exactly what the
# public portal does: the PUBLIC, hash-verified catalog generated by
# `scripts/build_public.py --variant studio`, and one exact-match location per approved file
# (generated into /etc/nginx/studio/media.conf, included below). REVIEW_REQUIRED / INTERNAL /
# unregistered videos, guide.html and every other path are 404: there is no generic alias, no
# SPA fallback, no directory listing and no CORS, and only GET/HEAD are accepted.
#
# add_header is used only at server level (location blocks use `expires` instead) so the
# security headers below are inherited by every response. Framing is limited to the same
# origin, which is how Studio embeds the page.
server {
    listen 8086;
    server_name _;
    server_tokens off;
    autoindex off;
    absolute_redirect off;
    root /usr/share/nginx/html;

    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Studio's router only strips /_svc/videos when a "/" follows it, so a bare
    # /_svc/videos arrives here unchanged. The page's URLs are relative to the slash form.
    location = /_svc/videos {
        return 301 /_svc/videos/;
    }

    location = / {
        try_files /index.html =404;
        expires epoch;
    }

    location = /index.html  { expires epoch; }
    location = /portal.css  { expires epoch; }
    location = /portal.js   { expires epoch; }
    location = /videos.json { expires epoch; }

    # One exact-match location per approved file. Exact matches win over the rules below.
    include /etc/nginx/studio/media.conf;

    location ^~ /videos/ {
        return 404;
    }

    location / {
        return 404;
    }
}
