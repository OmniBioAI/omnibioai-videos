name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate nginx.conf
        run: |
          if [ -f nginx.conf ]; then
            docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx nginx -t
          else
            echo "No nginx.conf found, skipping validation"
          fi

  publish-docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/omnibioai/omnibioai-videos
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3

      - name: Assert full OCI revision
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          test "${#FULL_SHA}" -eq 40
          test "$FULL_SHA" = "$(git rev-parse HEAD)"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify remote multiarch manifest
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          set -eu
          manifest=$(docker buildx imagetools inspect "ghcr.io/omnibioai/omnibioai-videos:$FULL_SHA")
          echo "$manifest"
          echo "$manifest" | grep -q 'Platform:    linux/amd64'
          echo "$manifest" | grep -q 'Platform:    linux/arm64'
