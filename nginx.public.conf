# Public, read-only video portal (videos.omnibioai.org).
#
# Serves ONLY: the static portal (web root), the catalog generated at runtime by
# runtime/publish-runtime.sh, and the media files that script has verified against their
# approved SHA-256. Each such file gets one exact-match `location = /videos/<file>`
# (generated into /run/publication/media.conf, included below); every other path --
# including everything else in the read-only host content directory, guide.html, dotfiles,
# source maps and REVIEW_REQUIRED / INTERNAL / unregistered videos -- is a 404. There is no
# generic alias onto the content directory, no SPA fallback, no directory listing, no CORS,
# and only GET/HEAD are accepted.
#
# add_header is used only at server level (location blocks use `expires` instead) so the
# security headers below are inherited by every response.
server {
    listen 8087;
    server_name _;
    server_tokens off;
    autoindex off;
    root /usr/share/nginx/html;

    # Large media: hand the kernel big chunks but never let one client monopolise a worker.
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = / {
        try_files /index.html =404;
        expires epoch;
    }

    location = /index.html { expires epoch; }
    location = /portal.css { expires epoch; }
    location = /portal.js  { expires epoch; }

    # Generated catalog (verified PUBLIC entries only): always revalidate so a withheld video disappears at once.
    location = /videos.json {
        alias /run/publication/videos.json;
        default_type application/json;
        expires epoch;
    }

    # One exact-match location per verified PUBLIC file. Exact matches win over the prefix rule below.
    include /run/publication/media.conf;

    # Everything else under /videos/ (REVIEW_REQUIRED, INTERNAL, unknown, unregistered, the directory itself).
    location ^~ /videos/ {
        return 404;
    }

    # Fail closed for every other path.
    location / {
        return 404;
    }
}
