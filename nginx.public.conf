# Public, read-only video portal (videos.omnibioai.org).
#
# Serves ONLY the bundle produced by scripts/build_public.py: the portal page,
# its stylesheet/script, the generated /videos.json catalog and the PUBLIC media
# under /videos/. Everything else -- including guide.html, dotfiles, source maps
# and any path not listed below -- is a 404. There is no SPA fallback, no
# directory listing, no CORS, and only GET/HEAD are accepted.
#
# add_header is used only at server level (location blocks use `expires`
# instead) so the security headers below are inherited by every response.
server {
    listen 8087;
    server_name _;
    server_tokens off;
    autoindex off;
    root /usr/share/nginx/html;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = / {
        try_files /index.html =404;
        expires epoch;
    }

    location = /index.html { expires epoch; }
    location = /portal.css { expires 1h; }
    location = /portal.js  { expires 1h; }

    # Generated catalog: always revalidate so an unpublished video disappears at once.
    location = /videos.json { expires epoch; }

    # Media: the directory contains only PUBLIC files. No listing of the directory itself.
    location = /videos/ { return 404; }
    location ^~ /videos/ {
        types { video/mp4 mp4; video/webm webm; }
        default_type application/octet-stream;
        expires 1h;
    }

    # Fail closed for every other path.
    location / {
        return 404;
    }
}
